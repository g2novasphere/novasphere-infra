name: terraform-security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov - Terraform security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install checkov==3.3.30   # même version que le scan documenté dans SECURITE.md §5

      - name: Scan Terraform environments
        # Exceptions justifiées dans SECURITE.md §5 et non marquées dans le code :
        # CKV_TF_1 (le cahier impose des tags vX.Y.Z, pas des hash de commit),
        # CKV_AWS_394 (zones de disponibilité, réduites à deux par slice dans network.tf).
        run: checkov --directory envs/ --framework terraform --quiet --skip-download --skip-check CKV_TF_1,CKV_AWS_394
